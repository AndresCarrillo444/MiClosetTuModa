<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accesorios de moda en MiClosetTuModa  Bolsos, joyería, gafas y más. Complementa tu look con nuestros accesorios premium.">
  <title>Accesorios  MiClosetTuModa</title>
  <link rel="icon" type="image/png" href="imgs/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>
  <main id="main-content">
    <section class="category-banner" aria-label="Sección Accesorios">
      <img src="imgs/Categorias/Accesorios.jpg" alt="Colección de accesorios" loading="eager">
      <div class="category-banner-overlay"></div>
      <div class="container">
        <div class="category-banner-content animate-fadeInUp">
          <h1>Accesorios</h1>
          <p>Los detalles que elevan tu outfit al siguiente nivel</p>
        </div>
      </div>
    </section>

    <section style="padding: var(--space-12) 0 var(--space-20);" aria-labelledby="accesorios-title">
      <div class="container">
        <div class="filters-bar">
          <div class="filter-chips" role="group" aria-label="Filtrar por categoría">
            <button class="filter-chip active" data-filter="all" aria-pressed="true">Todos</button>
            <button class="filter-chip" data-filter="Joyería" aria-pressed="false">Joyería</button>
            <button class="filter-chip" data-filter="Gafas" aria-pressed="false">Gafas</button>
            <button class="filter-chip" data-filter="Cabello" aria-pressed="false">Cabello</button>
          </div>
          <select class="sort-select" id="sort-select" aria-label="Ordenar productos">
            <option value="default">Relevancia</option>
            <option value="price-asc">Precio: Menor a Mayor</option>
            <option value="price-desc">Precio: Mayor a Menor</option>
            <option value="name-asc">Nombre A-Z</option>
            <option value="new">Novedades primero</option>
            <option value="offer">Ofertas primero</option>
          </select>
        </div>
        <div id="products-count" style="font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--space-6);" aria-live="polite"></div>
        <div class="products-grid" id="products-grid" role="list"></div>
      </div>
    </section>

    <section class="newsletter-section" aria-labelledby="newsletter-acc-title">
      <div class="container newsletter-content">
        <i class="newsletter-icon fas fa-gem" aria-hidden="true"></i>
        <h2 id="newsletter-acc-title">Recibe las últimas joyas y tendencias</h2>
        <p>Suscríbete y sé el primero en conocer los nuevos accesorios de temporada.</p>
        <form class="newsletter-form" id="newsletter-form">
          <input type="email" name="email" placeholder="Tu correo electrónico" required aria-label="Correo">
          <button type="submit">Suscribirse</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/services/ProductService.js"></script>
  <script src="js/services/CartService.js"></script>
  <script src="js/services/WishlistService.js"></script>
  <script src="js/services/NotificationService.js"></script>
  <script src="js/services/FilterService.js"></script>
  <script src="js/components/HelpModal.js"></script>
  <script src="js/components/Header.js"></script>
  <script src="js/components/Footer.js"></script>
  <script src="js/components/CartSidebar.js"></script>
  <script src="js/components/SearchOverlay.js"></script>
  <script src="js/components/ProductModal.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CatalogPage.init('accesorios');
    });
  </script>
</body>
</html>
