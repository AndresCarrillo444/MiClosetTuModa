<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ropa de mujer en MiClosetTuModa  Vestidos, blusas, pantalones, faldas, chaquetas y accesorios. Las últimas tendencias a precios increíbles.">
  <meta name="keywords" content="ropa mujer, vestidos, blusas, faldas, moda femenina Colombia">
  <title>Mujer  MiClosetTuModa</title>
  <link rel="icon" type="image/png" href="imgs/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>
  <!-- Header inyectado por JS -->

  <main id="main-content">
    <!-- --------------- BANNER --------------- -->
    <section class="category-banner" aria-label="Sección Mujer">
      <img src="imgs/Categorias/Mujeres.jpg" alt="Colección de moda mujer" loading="eager">
      <div class="category-banner-overlay"></div>
      <div class="container">
        <div class="category-banner-content animate-fadeInUp">
          <h1>Colección Mujer</h1>
          <p>Más de 200 prendas para crear tu estilo único</p>
        </div>
      </div>
    </section>

    <!-- --------------- FILTROS + PRODUCTOS --------------- -->
    <section style="padding: var(--space-12) 0 var(--space-20);" aria-labelledby="mujer-title">
      <div class="container">
        <div class="filters-bar">
          <div class="filter-chips" role="group" aria-label="Filtrar por categoría" id="filter-chips">
            <button class="filter-chip active" data-filter="all" aria-pressed="true">Todos</button>
            <button class="filter-chip" data-filter="Vestidos" aria-pressed="false">Vestidos</button>
            <button class="filter-chip" data-filter="Blusas" aria-pressed="false">Blusas</button>
            <button class="filter-chip" data-filter="Pantalones" aria-pressed="false">Pantalones</button>
            <button class="filter-chip" data-filter="Faldas" aria-pressed="false">Faldas</button>
            <button class="filter-chip" data-filter="Chaquetas" aria-pressed="false">Chaquetas</button>
            <button class="filter-chip" data-filter="Accesorios" aria-pressed="false">Accesorios</button>
          </div>
          <select class="sort-select" id="sort-select" aria-label="Ordenar productos">
            <option value="default">Relevancia</option>
            <option value="price-asc">Precio: Menor a Mayor</option>
            <option value="price-desc">Precio: Mayor a Menor</option>
            <option value="name-asc">Nombre A-Z</option>
            <option value="new">Novedades primero</option>
            <option value="offer">Ofertas primero</option>
          </select>
        </div>

        <div id="products-count" style="font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--space-6);" aria-live="polite"></div>

        <div class="products-grid" id="products-grid" role="list"></div>
      </div>
    </section>

    <!-- --------------- NEWSLETTER --------------- -->
    <section class="newsletter-section" aria-labelledby="newsletter-mujer-title">
      <div class="container newsletter-content">
        <i class="newsletter-icon fas fa-envelope-open-text" aria-hidden="true"></i>
        <h2 id="newsletter-mujer-title">Recibe las últimas tendencias</h2>
        <p>Suscríbete y sé la primera en conocer nuestras novedades y ofertas exclusivas.</p>
        <form class="newsletter-form" id="newsletter-form">
          <input type="email" name="email" placeholder="Tu correo electrónico"
                 required aria-label="Correo electrónico">
          <button type="submit">Suscribirse</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer inyectado por JS -->

  <!-- Scripts -->
  <script src="js/services/ProductService.js"></script>
  <script src="js/services/CartService.js"></script>
  <script src="js/services/WishlistService.js"></script>
  <script src="js/services/NotificationService.js"></script>
  <script src="js/services/FilterService.js"></script>
  <script src="js/components/HelpModal.js"></script>
  <script src="js/components/Header.js"></script>
  <script src="js/components/Footer.js"></script>
  <script src="js/components/CartSidebar.js"></script>
  <script src="js/components/SearchOverlay.js"></script>
  <script src="js/components/ProductModal.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script>
    // Inicializar página de catálogo para sección "mujer"
    document.addEventListener('DOMContentLoaded', () => {
      CatalogPage.init('mujer');
    });
  </script>
</body>
</html>
