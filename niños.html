<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ropa de niños en MiClosetTuModa  Conjuntos, vestidos, chaquetas y más para niñas y niños. Moda infantil divertida y cómoda.">
  <title>Niños  MiClosetTuModa</title>
  <link rel="icon" type="image/png" href="imgs/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>
  <main id="main-content">
    <section class="category-banner" aria-label="Sección Niños">
      <img src="imgs/Categorias/niños.jpg" alt="Colección de moda infantil" loading="eager">
      <div class="category-banner-overlay" style="background: linear-gradient(to right, rgba(69,123,157,0.85) 0%, rgba(69,123,157,0.5) 60%, transparent 100%);"></div>
      <div class="container">
        <div class="category-banner-content animate-fadeInUp">
          <h1>Colección Niños</h1>
          <p>Moda divertida y cómoda para los más pequeños</p>
        </div>
      </div>
    </section>

    <section style="padding: var(--space-12) 0 var(--space-20);" aria-labelledby="ninos-title">
      <div class="container">
        <div class="filters-bar">
          <div class="filter-chips" role="group" aria-label="Filtrar por categoría">
            <button class="filter-chip active" data-filter="all" aria-pressed="true">Todos</button>
            <button class="filter-chip" data-filter="Conjuntos" aria-pressed="false">Conjuntos</button>
            <button class="filter-chip" data-filter="Vestidos" aria-pressed="false">Vestidos</button>
            <button class="filter-chip" data-filter="Blusas" aria-pressed="false">Blusas</button>
            <button class="filter-chip" data-filter="Pantalones" aria-pressed="false">Pantalones</button>
            <button class="filter-chip" data-filter="Chaquetas" aria-pressed="false">Chaquetas</button>
            <button class="filter-chip" data-filter="Camisas" aria-pressed="false">Camisetas</button>
          </div>
          <select class="sort-select" id="sort-select" aria-label="Ordenar productos">
            <option value="default">Relevancia</option>
            <option value="price-asc">Precio: Menor a Mayor</option>
            <option value="price-desc">Precio: Mayor a Menor</option>
            <option value="name-asc">Nombre A-Z</option>
            <option value="offer">Ofertas primero</option>
          </select>
        </div>
        <div id="products-count" style="font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--space-6);" aria-live="polite"></div>
        <div class="products-grid" id="products-grid" role="list"></div>
      </div>
    </section>

    <section class="newsletter-section" aria-labelledby="newsletter-ninos-title">
      <div class="container newsletter-content">
        <i class="newsletter-icon fas fa-child" aria-hidden="true"></i>
        <h2 id="newsletter-ninos-title">Novedades para tus pequeños</h2>
        <p>Entérate primero de las nuevas colecciones infantiles y ofertas especiales.</p>
        <form class="newsletter-form" id="newsletter-form">
          <input type="email" name="email" placeholder="Tu correo electrónico" required aria-label="Correo">
          <button type="submit">Suscribirse</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/services/ProductService.js"></script>
  <script src="js/services/CartService.js"></script>
  <script src="js/services/WishlistService.js"></script>
  <script src="js/services/NotificationService.js"></script>
  <script src="js/services/FilterService.js"></script>
  <script src="js/components/HelpModal.js"></script>
  <script src="js/components/Header.js"></script>
  <script src="js/components/Footer.js"></script>
  <script src="js/components/CartSidebar.js"></script>
  <script src="js/components/SearchOverlay.js"></script>
  <script src="js/components/ProductModal.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CatalogPage.init('ninos');
    });
  </script>
</body>
</html>
